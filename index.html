<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE卡</title>
  <meta name="description" content="用LINE打卡">
  <meta property="og:title" content="LINE卡">
  <meta property="og:description" content="用LINE打卡">
  <style>
    :root {
      --primary: #06C755;
      --danger: #FF4757;
      --warning: #F59E0B;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --subtext: #94A3B8;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      text-align: center;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }
    /* Version Tag on Top Left */
    .version-tag {
      position: absolute;
      top: 14px;
      left: 16px;
      background: #0284C7;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }
    /* Profile Icon Button on Top Right */
    .profile-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .profile-btn:active { background: rgba(255,255,255,0.25); }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin-bottom: 14px;
      border: 3px solid var(--primary);
      box-shadow: 0 0 16px rgba(6, 199, 85, 0.4);
    }
    .user-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .status-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      margin-bottom: 20px;
      color: #38BDF8;
      text-align: left;
      line-height: 1.5;
      border: 1px solid rgba(56, 189, 248, 0.2);
      white-space: pre-wrap;
    }
    .error-box { color: #F87171; border-color: rgba(248,113,113,0.3); background: rgba(239,68,68,0.1); }
    .success-box { color: #4ADE80; border-color: rgba(74,222,128,0.3); background: rgba(34,197,94,0.1); }
    .warning-box { color: #FBBF24; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.1); }
    .desktop-warning {
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.4);
      color: #FBBF24;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 18px 0;
      font-size: 19px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
      margin-bottom: 14px;
      box-sizing: border-box;
    }
    .btn:active { transform: scale(0.97); }
    .btn-in { background: linear-gradient(135deg, #06C755, #059669); box-shadow: 0 4px 16px rgba(6,199,85,0.3); }
    .btn-out { background: linear-gradient(135deg, #FF4757, #DC2626); box-shadow: 0 4px 16px rgba(255,71,87,0.3); }
    .btn-apply { background: linear-gradient(135deg, #0284C7, #2563EB); box-shadow: 0 4px 16px rgba(2,132,199,0.3); }
    .btn-leave { background: linear-gradient(135deg, #7C3AED, #5B21B6); box-shadow: 0 4px 16px rgba(124,58,237,0.3); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; filter: grayscale(80%); }

    /* ======================== */
    /* Tab Navigation           */
    /* ======================== */
    .tab-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 6px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #94A3B8;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: rgba(6, 199, 85, 0.15);
      color: #4ADE80;
      border: 1px solid rgba(6, 199, 85, 0.3);
    }
    .tab-btn:active { transform: scale(0.97); }
    .review-badge {
      display: inline-block;
      background: #FF4757;
      color: white;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 8px;
      margin-left: 3px;
      vertical-align: middle;
    }
    .tab-content { display: none; }

    /* ======================== */
    /* Admin Panel Styling      */
    /* ======================== */
    .admin-panel {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: left;
      margin-top: 16px;
    }
    .admin-title {
      font-size: 14px;
      font-weight: bold;
      color: #38BDF8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .user-info { display: flex; flex-direction: column; }
    .user-time { font-size: 11px; color: #94A3B8; margin-top: 2px; }
    .admin-actions { display: flex; gap: 6px; }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    .btn-approve { background: #059669; }
    .btn-reject { background: #DC2626; }

    /* ======================== */
    /* Leave Form Styles        */
    /* ======================== */
    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: #38BDF8;
      margin-bottom: 12px;
      text-align: left;
    }
    .leave-proof-notice {
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #FBBF24;
      margin-bottom: 12px;
      text-align: left;
      line-height: 1.5;
    }
    .leave-item {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      text-align: left;
    }
    .leave-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .leave-item-type { font-weight: bold; font-size: 13px; color: #F8FAFC; }
    .leave-item-time { font-size: 11px; color: #94A3B8; margin-top: 2px; }
    .leave-item-note { font-size: 11px; color: #64748B; margin-top: 4px; }
    .leave-status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .ls-pending { background: rgba(245,158,11,0.15); color: #FBBF24; }
    .ls-approved { background: rgba(74,222,128,0.15); color: #4ADE80; }
    .ls-rejected { background: rgba(248,113,113,0.15); color: #F87171; }

    /* ======================== */
    /* Leave Review Item        */
    /* ======================== */
    .leave-review-item {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(245, 158, 11, 0.2);
      text-align: left;
    }
    .leave-review-name { font-weight: bold; font-size: 14px; color: #FBBF24; margin-bottom: 4px; }
    .leave-review-detail { font-size: 12px; color: #94A3B8; line-height: 1.7; }
    .leave-review-actions { display: flex; gap: 8px; margin-top: 10px; }

    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }

    /* ======================== */
    /* Personal Center Modal    */
    /* ======================== */
    .modal-overlay {
      position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: flex; justify-content: center; align-items: flex-end;
      visibility: hidden; opacity: 0;
      transition: visibility 0.2s, opacity 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content {
      background: #1E293B;
      width: 100%; max-width: 440px; max-height: 85vh;
      overflow-y: auto;
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      padding: 24px; box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 -12px 32px rgba(0,0,0,0.5);
      color: var(--text); text-align: left;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 14px; margin-bottom: 18px;
    }
    .modal-title { font-size: 18px; font-weight: bold; color: #38BDF8; }
    .modal-close {
      background: rgba(255,255,255,0.1); border: none; color: white;
      width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer;
    }
    .profile-card {
      background: rgba(15,23,42,0.6); border-radius: 14px;
      padding: 16px; margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .role-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-top: 6px; }
    .role-owner { background: #8B5CF6; color: white; }
    .role-admin { background: #0284C7; color: white; }
    .role-emp { background: #475569; color: white; }
    .hours-box {
      background: linear-gradient(135deg, rgba(6,199,85,0.15), rgba(5,150,105,0.05));
      border: 1px solid rgba(6,199,85,0.3);
      border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center;
    }
    .hours-num { font-size: 32px; font-weight: 800; color: #4ADE80; margin: 6px 0; }
    .hours-cycle { font-size: 12px; color: #94A3B8; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
    .history-table th, .history-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .history-table th { color: #94A3B8; font-size: 12px; font-weight: 600; background: rgba(15,23,42,0.4); }
    .badge-in { background: rgba(6,199,85,0.15); color: #4ADE80; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
    .badge-out { background: rgba(255,71,87,0.15); color: #F87171; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
    .btn-more {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #38BDF8; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: bold;
      cursor: pointer; margin-top: 10px; transition: background 0.2s;
    }
    .btn-more:active { background: rgba(56,189,248,0.15); }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #94A3B8; margin-bottom: 4px; }
    .input-control {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0F172A; color: white; box-sizing: border-box; font-size: 14px;
    }
    textarea.input-control { resize: vertical; min-height: 72px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="version-tag">v2.2</div>
    <button class="profile-btn" onclick="toggleProfileModal(true)">👤</button>

    <img id="avatar" class="avatar" src="https://via.placeholder.com/88/06C755/FFFFFF?text=LINE" alt="Avatar">
    <div id="userName" class="user-name">連線中...</div>

    <!-- Desktop Lock Notice Banner -->
    <div id="desktopLockBanner" class="desktop-warning" style="display:none;">
      ⛔ 請改用手機 LINE App 開啟本頁面打卡。
    </div>

    <div id="statusBox" class="status-box">請稍候，系統正在初始化身份資訊...</div>

    <!-- First-Time User Apply Section -->
    <div id="applySection" style="display:none;">
      <button class="btn btn-apply" onclick="handleApply()">📝 提交打卡權限申請</button>
    </div>

    <!-- Tab Navigation (only shown for APPROVED users) -->
    <div id="tabNav" class="tab-nav" style="display:none;">
      <button class="tab-btn active" id="tab-punch" onclick="switchTab('punch')">📍 打卡</button>
      <button class="tab-btn" id="tab-leave" onclick="switchTab('leave')">📋 請假</button>
      <button class="tab-btn" id="tab-review" onclick="switchTab('review')" style="display:none;">🔍 審核<span id="reviewBadge" class="review-badge">0</span></button>
    </div>

    <!-- ======================== -->
    <!-- Tab: 打卡               -->
    <!-- ======================== -->
    <div id="tabContent-punch" class="tab-content">
      <!-- Approved Punch Action Buttons -->
      <div id="actionButtons" style="display:none;">
        <button id="btnIn" class="btn btn-in" onclick="handlePunch('上班')">📍 上班打卡</button>
        <button id="btnOut" class="btn btn-out" onclick="handlePunch('下班')">🔴 下班打卡</button>
      </div>

      <!-- Admin Review Panel (打卡權限審核) -->
      <div id="adminSection" class="admin-panel" style="display:none;">
        <div class="admin-title">⚙️ 打卡權限審核 (待審核同仁)</div>
        <div id="pendingUsersList"></div>
      </div>
    </div>

    <!-- ======================== -->
    <!-- Tab: 請假               -->
    <!-- ======================== -->
    <div id="tabContent-leave" class="tab-content">
      <!-- Leave Application Form -->
      <div style="text-align:left;">
        <div class="section-title">📋 請假申請</div>

        <div class="input-group">
          <label>假別</label>
          <select id="leaveType" class="input-control" onchange="onLeaveTypeChange()">
            <option value="">-- 請選擇假別 --</option>
            <option value="年假/特休">年假/特休</option>
            <option value="病假">病假</option>
            <option value="事假">事假</option>
            <option value="婚假">婚假</option>
            <option value="喪假">喪假</option>
            <option value="產假">產假</option>
            <option value="陪產假">陪產假</option>
          </select>
        </div>

        <!-- Proof Notice (hidden until non-特休 selected) -->
        <div id="proofNotice" class="leave-proof-notice" style="display:none;">
          📎 提醒：此假別需提供相關證明文件，請自行向主管提交實體證明。
        </div>

        <div class="input-group">
          <label>開始日期與時間</label>
          <input type="datetime-local" id="leaveStart" class="input-control">
        </div>

        <div class="input-group">
          <label>結束日期與時間</label>
          <input type="datetime-local" id="leaveEnd" class="input-control">
        </div>

        <div class="input-group">
          <label id="noteLabel">備註原因（選填）</label>
          <textarea id="leaveNote" class="input-control" placeholder="請填寫請假原因..."></textarea>
        </div>

        <button id="btnLeaveSubmit" class="btn btn-leave" onclick="handleLeaveSubmit()" style="margin-bottom:20px;">📤 送出請假申請</button>
      </div>

      <hr class="divider">

      <!-- My Leave History -->
      <div class="section-title">📜 我的請假紀錄</div>
      <div id="myLeavesList">
        <div style="font-size:12px; color:#94A3B8; text-align:center; padding:12px;">尚無請假紀錄</div>
      </div>
    </div>

    <!-- ======================== -->
    <!-- Tab: 審核 (admin only)  -->
    <!-- ======================== -->
    <div id="tabContent-review" class="tab-content">
      <div class="section-title">🔍 請假審核</div>
      <div id="leaveReviewList">
        <div style="font-size:12px; color:#94A3B8; text-align:center; padding:12px;">目前無待審核申請</div>
      </div>
    </div>
  </div>

  <!-- Personal Center Modal -->
  <div id="profileModal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">👤 個人中心</div>
        <button class="modal-close" onclick="toggleProfileModal(false)">✕</button>
      </div>

      <!-- Section 1: User Profile & Role Info -->
      <div class="profile-card">
        <div style="font-weight:bold; font-size:16px;" id="modalUserTitle"> Paul</div>
        <div id="modalRoleBadge" class="role-badge role-owner">👑 開發者</div>
      </div>

      <!-- Section 2: Monthly Work Hours Stat Card -->
      <div class="hours-box">
        <div style="font-size:13px; color:#94A3B8;">⏱️ 本月累計工作時數</div>
        <div id="modalMonthlyHours" class="hours-num">0.0 小時</div>
        <div id="modalCycleText" class="hours-cycle">計薪區間: --</div>
      </div>

      <!-- Section 3: Recent Punch History Table & Show More Button -->
      <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:#38BDF8;">📜 打卡歷史紀錄</div>
      <div class="profile-card" style="padding:10px;">
        <div id="recentHistoryTableBox">
          <div style="font-size:12px; color:#94A3B8; text-align:center; padding:8px;">無紀錄</div>
        </div>
        <button id="btnToggleHistory" class="btn-more" style="display:none;" onclick="toggleHistoryMore()">🔽 展開更多歷史紀錄</button>
      </div>

      <!-- Section 4: Company Settings Form (OWNER / ADMIN Only) -->
      <div id="companySettingsCard" class="profile-card" style="display:none;">
        <div style="font-weight:bold; font-size:14px; margin-bottom:12px; color:#F59E0B;">⚙️ 公司考勤與計薪設定 (主管專屬)</div>

        <div class="input-group">
          <label>每月計薪起算日 (1日 ~ 31日)</label>
          <select id="setCutoffDay" class="input-control">
            <!-- 1 to 31 options -->
          </select>
        </div>

        <div class="input-group">
          <label>公司 GPS 緯度 (Latitude)</label>
          <input type="text" id="setCompanyLat" class="input-control" placeholder="例: 22.6057">
        </div>

        <div class="input-group">
          <label>公司 GPS 經度 (Longitude)</label>
          <input type="text" id="setCompanyLng" class="input-control" placeholder="例: 120.3248">
        </div>

        <button class="btn-sm btn-approve" style="width:100%; margin-bottom:12px; padding:8px 0;" onclick="fetchCurrentGpsForCompany()">📍 抓取當前手機定位為公司地址</button>

        <div class="input-group">
          <label>允許打卡範圍半徑 (公尺, 0 代表不限制)</label>
          <input type="number" id="setAllowedRadius" class="input-control" value="200">
        </div>

        <button class="btn btn-apply" style="padding:12px 0; font-size:15px; margin-bottom:0;" onclick="saveCompanySettings()">💾 儲存公司考勤設定</button>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    var LIFF_ID = '2010885295-Rao11tsR';
    var API_URL = 'https://script.google.com/macros/s/AKfycbwsjmJdMBlEqQ85E4AnemT9H3FREtN8VGxP363dywxtHI1mGfYZjMAE3nXRiK6gNahu/exec';
    var currentUser = null;
    var lastPunchState = null;
    var userStatus = 'UNREGISTERED';
    var userRole = 'EMPLOYEE';
    var latestResponseData = null;
    var isShowingAllHistory = false;
    var autoPollTimer = null;
    var currentTab = 'punch';
    var myLeaves = [];
    var pendingLeaves = [];

    function initCutoffSelect() {
      var sel = document.getElementById('setCutoffDay');
      sel.innerHTML = '';
      for (var i = 1; i <= 31; i++) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = '每月 ' + i + ' 日起算';
        sel.appendChild(opt);
      }
    }

    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    function setStatus(msg, type) {
      var box = document.getElementById('statusBox');
      box.textContent = msg;
      box.className = 'status-box';
      if (type === 'error') box.classList.add('error-box');
      if (type === 'success') box.classList.add('success-box');
      if (type === 'warning') box.classList.add('warning-box');
    }

    function updateButtonStates(lastState) {
      var btnIn = document.getElementById('btnIn');
      var btnOut = document.getElementById('btnOut');
      if (lastState === '上班') {
        btnIn.disabled = true;
        btnOut.disabled = false;
      } else if (lastState === '下班') {
        btnIn.disabled = false;
        btnOut.disabled = true;
      } else {
        btnIn.disabled = false;

    function onLeaveTypeChange() {
      var leaveType = document.getElementById('leaveType').value;
      var noteLabel = document.getElementById('noteLabel');
      var leaveNote = document.getElementById('leaveNote');
      var proofNotice = document.getElementById('proofNotice');

      if (!leaveType || leaveType === '年假/特休') {
        noteLabel.textContent = '備註原因（選填）';
        leaveNote.required = false;
        proofNotice.style.display = 'none';

    function handleLeaveSubmit() {
      if (!currentUser || !currentUser.userId) {
        alert('尚未取得 LINE 身份，請重試');
        return;
      }

      var leaveType = document.getElementById('leaveType').value;
      var startTime = document.getElementById('leaveStart').value;
      var endTime = document.getElementById('leaveEnd').value;
      var note = document.getElementById('leaveNote').value.trim();

      if (!leaveType) { alert('請選擇假別'); return; }
      if (!startTime) { alert('請填寫開始日期與時間'); return; }
      if (!endTime) { alert('請填寫結束日期與時間'); return; }
      if (startTime >= endTime) { alert('結束時間必須晚於開始時間'); return; }
      if (leaveType !== '年假/特休' && !note) { alert('此假別必須填寫備註原因'); return; }

      var submitBtn = document.getElementById('btnLeaveSubmit');
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ 提交中...';

      var url = API_URL + '?action=submitLeave' +
        '&userId=' + encodeURIComponent(currentUser.userId) +
        '&userName=' + encodeURIComponent(currentUser.name) +
        '&leaveType=' + encodeURIComponent(leaveType) +
        '&startTime=' + encodeURIComponent(startTime.replace('T', ' ')) +
        '&endTime=' + encodeURIComponent(endTime.replace('T', ' ')) +
        '&note=' + encodeURIComponent(note);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.success) {
            alert('✅ 請假申請已提交！請等待管理者審核。');
            document.getElementById('leaveStart').value = '';
            document.getElementById('leaveEnd').value = '';
            document.getElementById('leaveNote').value = '';
            document.getElementById('leaveType').selectedIndex = 0;
            onLeaveTypeChange();
            submitBtn.disabled = false;
            submitBtn.textContent = '📤 送出請假申請';
            fetchUserStatusAndRender();
          } else {
            alert('❌ 提交失敗：' + (data && data.message ? data.message : '未知錯誤'));
            submitBtn.disabled = false;
            submitBtn.textContent = '📤 送出請假申請';
          }
        })
        .catch(function(err) {
          alert('❌ 網路錯誤：' + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = '📤 送出請假申請';
        });
    }

    function handleLeaveReview(leaveId, reviewAction, btnEl) {
      var actionText = reviewAction === 'approve' ? '批准' : '拒絕';
      if (!confirm('確定要' + actionText + '此請假申請嗎？')) return;

      // Disable all buttons in this item to prevent multi-clicking
      var parentCard = document.getElementById('leave-card-' + leaveId);
      if (parentCard) {
        var btns = parentCard.querySelectorAll('button');
        for (var b = 0; b < btns.length; b++) {
          btns[b].disabled = true;
        }
      }
      if (btnEl) {
        btnEl.textContent = '⏳ 處理中...';
      }

      var url = API_URL + '?action=reviewLeave' +
        '&adminUserId=' + encodeURIComponent(currentUser.userId) +
        '&leaveId=' + encodeURIComponent(leaveId) +
        '&reviewAction=' + encodeURIComponent(reviewAction);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.success) {
            alert('✅ 已成功' + actionText + '！');
            fetchUserStatusAndRender();
          } else {
            alert('❌ 操作失敗：' + (data && data.message ? data.message : '未知錯誤'));
            if (parentCard) {
              var btns = parentCard.querySelectorAll('button');
              for (var b = 0; b < btns.length; b++) btns[b].disabled = false;
            }
            if (btnEl) btnEl.textContent = reviewAction === 'approve' ? '✅ 批准' : '❌ 拒絕';
          }
        })
        .catch(function(err) {
          alert('❌ 網路錯誤：' + err.message);
          if (parentCard) {
            var btns = parentCard.querySelectorAll('button');
            for (var b = 0; b < btns.length; b++) btns[b].disabled = false;
          }
          if (btnEl) btnEl.textContent = reviewAction === 'approve' ? '✅ 批准' : '❌ 拒絕';
        });
    }

    /* ======================== */
    /* LIFF Init                */
    /* ======================== */
    function initLiff() {
      initCutoffSelect();

      if (typeof liff === 'undefined') {
        setStatus('❌ LIFF SDK 載入失敗，請確認網路連線。', 'error');
        return;
      }

      liff.init({ liffId: LIFF_ID })
        .then(function() {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          var dec = liff.getDecodedIDToken();
          if (dec && dec.sub) {
            currentUser = {
              userId: dec.sub,
              name: dec.name || 'LINE 使用者',
              picture: dec.picture || 'https://via.placeholder.com/88/06C755/FFFFFF?text=LINE'
            };
            fetchUserStatusAndRender();
          } else {
            liff.getProfile().then(function(profile) {
              currentUser = {
                userId: profile.userId,
                name: profile.displayName,
                picture: profile.pictureUrl
              };
              fetchUserStatusAndRender();
            }).catch(function(err) {
              setStatus('❌ 取得用戶 profile 失敗: ' + err.message, 'error');
            });
          }
        })
        .catch(function(err) {
          setStatus('❌ LIFF 初始化失敗: ' + err.message, 'error');
        });
    }

    function enforceDesktopLock() {
      document.getElementById('desktopLockBanner').style.display = 'block';
      document.getElementById('statusBox').style.display = 'none';
      document.getElementById('applySection').style.display = 'none';
      document.getElementById('tabNav').style.display = 'none';
      document.getElementById('tabContent-punch').style.display = 'none';
      document.getElementById('tabContent-leave').style.display = 'none';
      document.getElementById('tabContent-review').style.display = 'none';
    }

    function fetchUserStatusAndRender() {
      document.getElementById('userName').textContent = currentUser.name;
      if (currentUser.picture) {
        document.getElementById('avatar').src = currentUser.picture;
      }

      if (!liff.isInClient() && !isMobileDevice()) {
        enforceDesktopLock();
        return;
      }

      fetch(API_URL + '?userId=' + encodeURIComponent(currentUser.userId))
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data) {
            latestResponseData = data;
            userStatus = data.userStatus || 'UNREGISTERED';
            userRole = data.userRole || 'EMPLOYEE';
            lastPunchState = data.lastPunchType || null;
            myLeaves = data.myLeaves || [];
            pendingLeaves = data.pendingLeaves || [];

            renderUserUI(data.pendingUsers || []);
          }
        })
        .catch(function(err) {
          console.warn('Fetch status error: ', err);
          renderUserUI([]);
        });
    }

    function renderUserUI(pendingUsers) {
      document.getElementById('desktopLockBanner').style.display = 'none';
      document.getElementById('statusBox').style.display = 'block';

      if (userStatus === 'UNREGISTERED') {
        setStatus('⚠️ 歡迎使用！您是首次開啟系統，請點擊下方按鈕提出打卡權限申請。', 'warning');
        document.getElementById('applySection').style.display = 'block';
        document.getElementById('tabNav').style.display = 'none';
        document.getElementById('tabContent-punch').style.display = 'none';
        document.getElementById('tabContent-leave').style.display = 'none';
        document.getElementById('tabContent-review').style.display = 'none';
      }
      else if (userStatus === 'PENDING') {
        setStatus('⏳ 您的打卡權限申請審核中，請通知管理員進行審核。', 'warning');
        document.getElementById('applySection').style.display = 'none';
        document.getElementById('tabNav').style.display = 'none';
        document.getElementById('tabContent-punch').style.display = 'none';
        document.getElementById('tabContent-leave').style.display = 'none';
        document.getElementById('tabContent-review').style.display = 'none';

        // Auto-poll every 8 seconds for pending approval
        if (!autoPollTimer) {
          autoPollTimer = setInterval(function() {
            if (userStatus === 'PENDING') {
              fetchUserStatusAndRender();
            } else {
              clearInterval(autoPollTimer);
              autoPollTimer = null;
            }
          }, 8000);
        }
      }
      else if (userStatus === 'REJECTED') {
        if (autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer = null; }
        setStatus('❌ 您的打卡權限申請未通過審核，無法進行打卡。', 'error');
        document.getElementById('applySection').style.display = 'none';
        document.getElementById('tabNav').style.display = 'none';
        document.getElementById('tabContent-punch').style.display = 'none';
        document.getElementById('tabContent-leave').style.display = 'none';
        document.getElementById('tabContent-review').style.display = 'none';
      }
      else if (userStatus === 'APPROVED') {
        if (autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer = null; }
        document.getElementById('applySection').style.display = 'none';
        document.getElementById('actionButtons').style.display = 'block';
        updateButtonStates(lastPunchState);

        var elapsedHours = (latestResponseData && latestResponseData.elapsedShiftHours) ? latestResponseData.elapsedShiftHours : 0;
        if (lastPunchState === '上班' && elapsedHours >= 10) {
          setStatus('⚠️ 溫馨提醒：您今日已上班 ' + elapsedHours + ' 小時，若已下班請記得點擊下班打卡！', 'warning');
        } else {
          setStatus('✅ LINE 身份驗證完成！', 'success');
        }

        // Render tab nav (controls review tab visibility)
        renderTabNav();

        // Ensure the currently active tab is visible, others hidden
        var tabs = ['punch', 'leave', 'review'];
        for (var i = 0; i < tabs.length; i++) {
          var t = tabs[i];
          var el = document.getElementById('tabContent-' + t);
          if (el) el.style.display = (t === currentTab) ? 'block' : 'none';
        }

        // Render leave-related content
        renderMyLeaves();
        renderLeaveReviewList();
      }

      // Admin: punch approval section (shown inside punch tab)
      if ((userRole === 'ADMIN' || userRole === 'OWNER') && pendingUsers && pendingUsers.length > 0) {
        document.getElementById('adminSection').style.display = 'block';
        renderPendingUsersList(pendingUsers);
      } else {
        document.getElementById('adminSection').style.display = 'none';
      }
    }

    function renderPendingUsersList(users) {
      var container = document.getElementById('pendingUsersList');
      if (!users || users.length === 0) {
        container.innerHTML = '';
        return;
      }

      var html = '';
      for (var i = 0; i < users.length; i++) {
        var u = users[i];
        var escapedId = escapeHtml(u.userId);
        html += '<div class="user-item" id="user-card-' + escapedId + '">' +
                  '<div class="user-info">' +
                    '<strong style="color:#F8FAFC;">' + escapeHtml(u.userName) + '</strong>' +
                    '<span class="user-time">申請: ' + escapeHtml(u.appliedAt) + '</span>' +
                  '</div>' +
                  '<div class="admin-actions">' +
                    '<button class="btn-sm btn-approve" onclick="handleApprove(\'' + escapedId + '\', \'APPROVED\', this)">✅ 批准</button>' +
                    '<button class="btn-sm btn-reject" onclick="handleApprove(\'' + escapedId + '\', \'REJECTED\', this)">❌ 拒絕</button>' +
                  '</div>' +
                '</div>';
      }
      container.innerHTML = html;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function handleApply() {
      if (!currentUser || !currentUser.userId) {
        alert('尚未取得 LINE 身份，請重試');
        return;
      }

      setStatus('⏳ 正在提交打卡權限申請...', '');
      document.querySelector('.btn-apply').disabled = true;

      var formData = new URLSearchParams();
      formData.append('action', 'apply');
      formData.append('userId', currentUser.userId);
      formData.append('userName', currentUser.name);

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      })
      .then(function() {
        userStatus = 'PENDING';
        setStatus('⏳ 申請已提交！請通知管理員進行審核。', 'warning');
        document.getElementById('applySection').style.display = 'none';
        // Auto poll for instant approval
        fetchUserStatusAndRender();
      })
      .catch(function(err) {
        document.querySelector('.btn-apply').disabled = false;
        setStatus('❌ 提交申請失敗: ' + err.message, 'error');
      });
    }

    function handleApprove(targetUserId, newStatus, btnEl) {
      if (!confirm('確定要 ' + (newStatus === 'APPROVED' ? '批准' : '拒絕') + ' 該同仁的打卡權限嗎？')) return;

      var parentCard = document.getElementById('user-card-' + targetUserId);
      if (parentCard) {
        var btns = parentCard.querySelectorAll('button');
        for (var b = 0; b < btns.length; b++) btns[b].disabled = true;
      }
      if (btnEl) btnEl.textContent = '⏳ 處理中...';

      setStatus('⏳ 正在更新同仁權限...', '');

      var formData = new URLSearchParams();
      formData.append('action', 'approveUser');
      formData.append('adminUserId', currentUser.userId);
      formData.append('targetUserId', targetUserId);
      formData.append('newStatus', newStatus);

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      })
      .then(function() {
        alert('已成功 ' + (newStatus === 'APPROVED' ? '批准' : '拒絕') + '！');
        fetchUserStatusAndRender();
      })
      .catch(function(err) {
        setStatus('❌ 操作失敗: ' + err.message, 'error');
        if (parentCard) {
          var btns = parentCard.querySelectorAll('button');
          for (var b = 0; b < btns.length; b++) btns[b].disabled = false;
        }
        if (btnEl) btnEl.textContent = newStatus === 'APPROVED' ? '✅ 批准' : '❌ 拒絕';
      });
    }

    function handlePunch(type) {
      if (!currentUser || !currentUser.userId) {
        alert('尚未取得 LINE 身份，請重試');
        return;
      }

      if (!liff.isInClient() && !isMobileDevice()) {
        alert('⛔ 請改用手機 LINE App 開啟本頁面打卡。');
        enforceDesktopLock();
        return;
      }

      if (userStatus !== 'APPROVED' && currentUser.userId !== 'Uad06e7dc67fd8bf94e77d6dc371a4299') {
        setStatus('❌ 無法打卡：您的帳號尚未審核通過，請通知管理員進行審核！', 'error');
        return;
      }

      document.getElementById('btnIn').disabled = true;
      document.getElementById('btnOut').disabled = true;
      setStatus('📡 正在定位中...', '');

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var acc = pos.coords.accuracy;
            sendPunchData(type, lat, lng, acc);
          },
          function(err) {
            console.warn('GPS error: ' + err.message);
            sendPunchData(type, '', '', '');
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
      } else {
        sendPunchData(type, '', '', '');
      }
    }

    function sendPunchData(type, lat, lng, acc) {
      setStatus('⏳ 正在驗證與寫入中...', '');

      var queryUrl = API_URL + '?action=punch' +
        '&userId=' + encodeURIComponent(currentUser.userId) +
        '&userName=' + encodeURIComponent(currentUser.name) +
        '&punchType=' + encodeURIComponent(type) +
        '&latitude=' + encodeURIComponent(lat || '') +
        '&longitude=' + encodeURIComponent(lng || '') +
        '&accuracy=' + encodeURIComponent(acc || '') +
        '&deviceType=Mobile';

      fetch(queryUrl)
        .then(function(res) { return res.json(); })
        .then(function(resData) {
          if (resData && resData.success) {
            lastPunchState = type;
            updateButtonStates(type);

            var timeStr = resData.time || '';
            setStatus(type + '打卡成功！\n姓名: ' + currentUser.name + '\n時間: ' + timeStr, 'success');

            // Refresh user status and history data
            fetchUserStatusAndRender();
          } else {
            updateButtonStates(lastPunchState);
            var errMsg = (resData && resData.message) ? resData.message : '❌ 打卡失敗：未知錯誤';
            setStatus(errMsg, 'error');
          }
        })
        .catch(function(err) {
          updateButtonStates(lastPunchState);
          setStatus('❌ 打卡請求失敗: ' + err.message, 'error');
        });
    }

    window.onload = initLiff;
  </script>
</body>
</html>
