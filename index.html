<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 打卡系統 (MVP)</title>
    <style>
      :root {
        --primary: #06C755;
        --danger: #E74C3C;
        --bg: #12181F;
        --card-bg: #1E2732;
        --text: #F5F6FA;
        --subtext: #A4B0BE;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .card {
        background: var(--card-bg);
        width: 100%;
        max-width: 400px;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        text-align: center;
        box-sizing: border-box;
      }
      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        margin-bottom: 12px;
        border: 3px solid var(--primary);
      }
      .user-name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 4px;
      }
      .user-id {
        font-size: 12px;
        color: var(--subtext);
        word-break: break-all;
        margin-bottom: 24px;
      }
      .status-box {
        background: rgba(255,255,255,0.05);
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        margin-bottom: 24px;
        min-height: 20px;
        color: #00CEC9;
      }
      .btn {
        width: 100%;
        padding: 16px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
        margin-bottom: 12px;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-in {
        background: var(--primary);
      }
      .btn-out {
        background: var(--danger);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img id="avatar" class="avatar" src="https://via.placeholder.com/80/06C755/FFFFFF?text=LINE" alt="Avatar">
      <div id="userName" class="user-name">正在驗證 LINE 身份...</div>
      <div id="userId" class="user-id"></div>

      <div id="statusBox" class="status-box">請稍候，正在初始化 LINE LIFF...</div>

      <button id="btnIn" class="btn btn-in" onclick="submitPunch('上班')" disabled>📍 上班打卡</button>
      <button id="btnOut" class="btn btn-out" onclick="submitPunch('下班')" disabled>📍 下班打卡</button>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      var liffId = "<?= liffId ?>";
      var idTokenCache = null;

      window.onload = function() {
        if (!liffId) {
          document.getElementById('statusBox').textContent = '⚠️ 提示：未設定 LIFF_ID，請在指令碼屬性設定。';
          return;
        }

        liff.init({ liffId: liffId }).then(function() {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          liff.getProfile().then(function(profile) {
            document.getElementById('userName').textContent = profile.displayName;
            document.getElementById('userId').textContent = 'ID: ' + profile.userId;
            if (profile.pictureUrl) {
              document.getElementById('avatar').src = profile.pictureUrl;
            }
          });

          idTokenCache = liff.getIDToken();
          document.getElementById('statusBox').textContent = '✅ 身份驗證完成，請選擇打卡項目。';
          document.getElementById('btnIn').disabled = false;
          document.getElementById('btnOut').disabled = false;
        }).catch(function(err) {
          document.getElementById('statusBox').textContent = '❌ LIFF 初始化失敗: ' + err.message;
        });
      };

      function submitPunch(type) {
        if (!idTokenCache) {
          alert('尚未完成身份驗證');
          return;
        }

        document.getElementById('btnIn').disabled = true;
        document.getElementById('btnOut').disabled = true;
        document.getElementById('statusBox').textContent = '⏳ 正在寫入打卡紀錄中...';

        google.script.run
          .withSuccessHandler(function(res) {
            document.getElementById('btnIn').disabled = false;
            document.getElementById('btnOut').disabled = false;
            if (res.status === 'success') {
              document.getElementById('statusBox').textContent = '🎉 ' + res.punchType + '打卡成功！ (' + res.punchTime + ')';
            } else {
              document.getElementById('statusBox').textContent = '❌ 打卡失敗: ' + res.message;
            }
          })
          .withFailureHandler(function(err) {
            document.getElementById('btnIn').disabled = false;
            document.getElementById('btnOut').disabled = false;
            document.getElementById('statusBox').textContent = '❌ 系統錯誤: ' + err.message;
          })
          .recordPunchServer(idTokenCache, type);
      }
    </script>
  </body>
</html>
